name: Naver Cafe Keyword Monitor

on:
  workflow_dispatch: # Actions 탭에서 수동 실행 가능
  schedule:
    # 3시간마다 실행 (KST 기준 2, 5, 8, 11, 14, 17, 20, 23시 정각)
    - cron: '0 1,4,7,10,13,16,19,22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run Cafe Monitor Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cafe_monitor.py

      # 카페 전용 히스토리 파일(cafe_history.json)을 Git에 저장하여 중복 방지
      - name: Commit and Push Cafe History
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f cafe_history.json ]; then
            git add cafe_history.json
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git commit -m "update: cafe monitoring history"
              git pull --rebase origin main  # 👈 충돌 방지를 위해 최신 내역 먼저 끌어오기
              git push origin main
            fi
          fi
